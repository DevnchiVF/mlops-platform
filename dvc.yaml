stages:
  generate:
    cmd: python src/data/generator.py
    deps:
      - src/data/generator.py
    params:
      - num_records
      - fraud_rate
      - random_seed
    outs:
      - data/raw/transactions.csv

  validate:
    cmd: python src/data/validate.py
    deps:
      - src/data/validate.py
      - data/raw/transactions.csv

  prepare:
    cmd: python src/training/prepare.py
    deps:
      - src/training/prepare.py
      - data/raw/transactions.csv
    params:
      - test_size
      - random_seed
    outs:
      - data/processed/X_test.csv
      - data/processed/X_train.csv
      - data/processed/y_test.csv
      - data/processed/y_train.csv

  train:
    cmd: python src/training/train.py
    deps:
      - src/training/train.py
      - data/processed/X_train.csv
      - data/processed/y_train.csv
    params:
      - class_weight
      - n_estimators
      - max_depth
      - min_samples_leaf
      - random_seed
    outs:
      - models/model.joblib

  evaluate:
    cmd: python src/training/evaluate.py
    deps:
      - src/training/evaluate.py
      - models/model.joblib
      - data/processed/X_test.csv
      - data/processed/y_test.csv
    params:
      - decision_threshold
    metrics:
      - metrics.json:
          cache: false
